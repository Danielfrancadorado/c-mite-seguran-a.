<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Eldorado Brasil</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div id="startScreen">

      <img src="logo.png" class="logo" alt

      <h1>Quiz de Segurança</h1>

      <input
        type="text"
        id="playerName"
        placeholder="Digite seu nome">

      <button onclick="startQuiz()">
        Iniciar Quiz
      </button>

    </div>

    <div id="quizScreen" class="hidden">

      <div class="top-bar">
        <span id="questionNumber"></span>
        <span id="timer">20</span>
      </div>

      <h2 id="question"></h2>

      <div id="answers"></div>

    </div>

    <div id="resultScreen" class="hidden">

      <h1>Fim do Quiz</h1>

      <h2 id="finalScore"></h2>

      <button onclick="location.reload()">
        Reiniciar
      </button>

    </div>

  </div>

  script.js"></script>

</body>
</html>
